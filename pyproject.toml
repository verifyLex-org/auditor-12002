[project]
name = "auditor-12002"
version = "0.1.0"
description = "Assistente auditável de revisão de técnica legislativa sob o Decreto nº 12.002/2024."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-git-revision-date-localized-plugin>=1.4,<2",
]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
