# Hooks executados antes de cada commit.
# Instalação (uma vez por clone):
#   uv run pre-commit install --install-hooks
# Execução manual em todo o repositório:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml utiliza tags !!python/name do pymdownx
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --offline --no-sync ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format check
        entry: uv run --offline --no-sync ruff format --check
        language: system
        types: [python]

      - id: manifest-integrity
        name: Integridade dos arquivos em stage
        entry: uv run --offline --no-sync python -m verify.manifest --staged
        language: system
        pass_filenames: false
        always_run: true
