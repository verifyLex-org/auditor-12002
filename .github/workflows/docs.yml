name: Documentação

# Valida build estrito em Pull Requests e publica no GitHub Pages em push na main.
# Requer Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "docs_hooks/**"
      - "tests/e2e/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "PREREGISTRO.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs_hooks/**"
      - "tests/e2e/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "PREREGISTRO.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build estrito da documentação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # datas de revisão das páginas via histórico git
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar ambiente com lockfile
        run: uv sync --locked

      - name: Verificar hook Python da documentação
        run: |
          uv run --frozen ruff check docs_hooks/
          uv run --frozen ruff format --check docs_hooks/

      - name: Compilar site MkDocs (--strict)
        run: uv run --frozen mkdocs build --strict

      - name: Instalar Chromium do Playwright
        run: uv run --frozen playwright install --with-deps --only-shell chromium

      - name: Testes E2E do portal (layout, contraste, erros)
        run: uv run --frozen pytest tests/e2e -m e2e

      - name: Configurar e enviar artefato do GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload do artefato Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
